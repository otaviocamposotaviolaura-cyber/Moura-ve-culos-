<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste Supabase | Moura Veículos</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sucesso {
      color: #00ff88;
    }

    .erro {
      color: #ff5555;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Teste do Supabase</h1>

    <p>
      Teste direto da conexão com o Supabase.
    </p>

    <button id="testButton">
      Testar conexão
    </button>

    <div
      id="resultado"
      class="resultado"
    >
      Aguardando teste...
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://tqwqqjaybdlbhfljdrui.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3g6oKAR6vsNArrB2jn3TeQ_ai9r4FSk";


    const resultado =
      document.getElementById("resultado");

    const testButton =
      document.getElementById("testButton");


    testButton.addEventListener(
      "click",
      async function () {

        resultado.className = "resultado";

        resultado.textContent =
          "Testando...";


        try {

          console.log(
            "URL:",
            SUPABASE_URL
          );

          console.log(
            "Chave:",
            SUPABASE_KEY
          );


          const resposta =
            await fetch(
              SUPABASE_URL + "/auth/v1/settings",
              {
                method: "GET",

                headers: {
                  "apikey": SUPABASE_KEY
                }
              }
            );


          const texto =
            await resposta.text();


          console.log(
            "Status:",
            resposta.status
          );

          console.log(
            "Resposta:",
            texto
          );


          if (resposta.ok) {

            resultado.className =
              "resultado sucesso";

            resultado.textContent =
              "CONEXÃO FUNCIONANDO!\n\n" +
              "Status: " +
              resposta.status +
              "\n\n" +
              texto;

          } else {

            resultado.className =
              "resultado erro";

            resultado.textContent =
              "SUPABASE RESPONDEU COM ERRO\n\n" +
              "Status: " +
              resposta.status +
              "\n\n" +
              texto;

          }


        } catch (erro) {

          console.error(
            "Erro:",
            erro
          );


          resultado.className =
            "resultado erro";

          resultado.textContent =
            "ERRO DE CONEXÃO\n\n" +
            erro.message;

        }

      }
    );

  </script>

</body>

</html>
