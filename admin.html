<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste de Login | Moura Veículos</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Teste de Login</h1>

    <label>
      E-mail
    </label>

    <input
      id="email"
      type="email"
      placeholder="Digite o e-mail"
    >

    <label>
      Senha
    </label>

    <input
      id="password"
      type="password"
      placeholder="Digite a senha"
    >

    <button id="loginButton">
      Testar login
    </button>

    <div id="resultado">
      Aguardando...
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://tqwqqjaybdlbhfljdrui.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3g6oKAR6vsNArrB2jn3TeQ_ai9r4FSk";


    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const resultado =
      document.getElementById("resultado");


    loginButton.addEventListener(
      "click",
      async function () {

        resultado.textContent =
          "Entrando...";


        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if (!emailValue || !passwordValue) {

          resultado.textContent =
            "Preencha o e-mail e a senha.";

          return;

        }


        try {

          console.log(
            "Iniciando login..."
          );


          const inicio =
            Date.now();


          const { data, error } =
            await supabase.auth.signInWithPassword({

              email: emailValue,

              password: passwordValue

            });


          const tempo =
            Date.now() - inicio;


          console.log(
            "Tempo:",
            tempo,
            "ms"
          );

          console.log(
            "Data:",
            data
          );

          console.log(
            "Erro:",
            error
          );


          if (error) {

            resultado.textContent =
              "ERRO NO LOGIN\n\n" +
              error.message +
              "\n\nCódigo: " +
              (error.status || "não informado") +
              "\n\nTempo: " +
              tempo +
              " ms";

            return;

          }


          if (data.session) {

            resultado.textContent =
              "LOGIN FUNCIONOU!\n\n" +
              "Usuário: " +
              data.user.email +
              "\n\n" +
              "Sessão criada com sucesso.";

          } else {

            resultado.textContent =
              "Login respondeu, mas não criou sessão.";

          }


        } catch (erro) {

          console.error(
            "Erro inesperado:",
            erro
          );


          resultado.textContent =
            "ERRO INESPERADO\n\n" +
            erro.message;

        }

      }
    );

  </script>

</body>

</html>
