<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste de Login | Moura Veículos</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sucesso {
      color: #00ff88;
    }

    .erro {
      color: #ff5555;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Teste de Login</h1>

    <p>
      Este teste verifica diretamente o login do Supabase.
    </p>


    <label>
      E-mail
    </label>

    <input
      id="email"
      type="email"
      placeholder="Digite o e-mail"
    >


    <label>
      Senha
    </label>

    <input
      id="password"
      type="password"
      placeholder="Digite a senha"
    >


    <button id="loginButton">
      Testar login
    </button>


    <div
      id="resultado"
      class="resultado"
    >
      Aguardando teste...
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://tqwqqjaybdlbhfljdrui.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3g6oKAR6vsNArrB2jn3TeQ_ai9r4FSk";


    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const resultado =
      document.getElementById("resultado");


    loginButton.addEventListener(
      "click",
      async function () {

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if (!emailValue || !passwordValue) {

          resultado.className =
            "resultado erro";

          resultado.textContent =
            "Digite o e-mail e a senha.";

          return;

        }


        resultado.className =
          "resultado";

        resultado.textContent =
          "Testando login...";


        try {

          console.log(
            "Tentando login..."
          );


          const resposta =
            await supabase.auth.signInWithPassword({

              email: emailValue,

              password: passwordValue

            });


          console.log(
            "Resposta completa:",
            resposta
          );


          if (resposta.error) {

            resultado.className =
              "resultado erro";

            resultado.textContent =
              "LOGIN RECUSADO\n\n" +
              "Mensagem:\n" +
              resposta.error.message +
              "\n\n" +
              "Código:\n" +
              (resposta.error.status || "não informado");

            return;

          }


          if (resposta.data &&
              resposta.data.session) {

            resultado.className =
              "resultado sucesso";

            resultado.textContent =
              "LOGIN FUNCIONOU!\n\n" +
              "Usuário:\n" +
              resposta.data.user.email +
              "\n\n" +
              "Sessão criada com sucesso.";

            return;

          }


          resultado.className =
            "resultado erro";

          resultado.textContent =
            "O Supabase respondeu, mas não criou uma sessão.\n\n" +
            JSON.stringify(
              resposta,
              null,
              2
            );


        } catch (erro) {

          console.error(
            "Erro inesperado:",
            erro
          );


          resultado.className =
            "resultado erro";

          resultado.textContent =
            "ERRO NO LOGIN\n\n" +
            erro.message;

        }

      }
    );

  </script>

</body>

</html>
