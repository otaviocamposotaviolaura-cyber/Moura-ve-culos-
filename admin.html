<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste Supabase | Moura Veículos</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sucesso {
      color: #00ff88;
    }

    .erro {
      color: #ff5555;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Teste do Supabase</h1>

    <p>
      Este teste verifica se o site consegue se comunicar
      com o Supabase.
    </p>

    <button id="testButton">
      Testar conexão
    </button>

    <div
      id="resultado"
      class="resultado"
    >
      Aguardando teste...
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuração -->
  <script src="./config.js"></script>


  <script>

    const resultado =
      document.getElementById("resultado");

    const testButton =
      document.getElementById("testButton");


    async function testarSupabase() {

      resultado.className = "resultado";

      resultado.textContent =
        "Testando conexão com o Supabase...";


      try {

        console.log("Iniciando teste...");

        console.log(
          "SUPABASE_URL:",
          SUPABASE_URL
        );

        console.log(
          "SUPABASE_KEY existe:",
          !!SUPABASE_KEY
        );


        const response = await fetch(
          SUPABASE_URL + "/auth/v1/settings",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY
            }
          }
        );


        console.log(
          "Status:",
          response.status
        );


        const texto =
          await response.text();


        console.log(
          "Resposta:",
          texto
        );


        if (response.ok) {

          resultado.className =
            "resultado sucesso";

          resultado.textContent =
            "CONEXÃO FUNCIONANDO!\n\n" +
            "Status: " +
            response.status +
            "\n\n" +
            texto;

        } else {

          resultado.className =
            "resultado erro";

          resultado.textContent =
            "SUPABASE RESPONDEU COM ERRO\n\n" +
            "Status: " +
            response.status +
            "\n\n" +
            texto;

        }


      } catch (error) {

        console.error(
          "Erro:",
          error
        );


        resultado.className =
          "resultado erro";

        resultado.textContent =
          "ERRO DE CONEXÃO\n\n" +
          error.message;

      }

    }


    testButton.addEventListener(
      "click",
      testarSupabase
    );


  </script>

</body>

</html>
